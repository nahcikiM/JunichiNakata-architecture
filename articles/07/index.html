        <p class="meta">
            掲載：全日本建築士会連合会機関誌『住と建築』2022年10月号　連載第7回／分量：全6ページ
        </p>
        <div class="summary">
          <p>実施設計段階でのディテール納まり（取り合い設計）、打込みタイルやアンカープレートの躯体仕上げ、
          手すり子ピッチ・格子梁コーナーRの現場調整、前川國男の「どう取り付けるかをわきまえてデザイン」
          を、熊本県立美術館・埼玉県立博物館の事例で詳細解説。基本設計からのボーリングデータ整合も示しています。
          </p>
