        <h2>05. 基本設計 コンセプト検証・法規チェック・バッファー空間・動線検討</h2>
        <p class="meta">
            掲載：全日本建築士会連合会機関誌『住と建築』2022年7月号　連載第5回／分量：全6ページ
        </p>
        <div class="summary">
          <p>企画案から基本設計へ移行する際のコンセプト再検証、法規・行政相談、利用者・運営者・モノの動線確保、
            前川建築の特徴であるバッファー空間（吹抜けロビー）の形成手法を、熊本県立美術館・国立国会図書館の事例で解説。
            建物周囲3m確保、喫茶・飲食スペースの配置こだわり、外構との関係性も詳細に論じています。
          </p>
        </div>
