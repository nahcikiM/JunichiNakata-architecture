        <h2>03. 施主の思いを建築化する企画とコンセプトづくり</h2>
        <p class="meta">
            掲載：全日本建築士会連合会機関誌『住と建築』2022年3月号　連載第3回／分量：全6ページ
        </p>
        <div class="summary">
          <p>施主の思いを汲み取り、コンセプトを軸に企画を組み立てるプロセスを、
            熊本県立美術館や国立国会図書館新館などの事例とともに解説した章です。
            構成図や敷地模型、機能図といった「見える化」の手法を通じて、関係者の意見を統合しながら
            建物の方向性と最適解を探る前川國男事務所の実践を紹介しています。
          </p>
        </div>
    </header>
