        <h2>09. 現場監理 出来高曲線・KUM監理ノート・設計監理分担</h2>
        <p class="meta">
            掲載：全日本建築士会連合会機関誌『住と建築』2022年12月号　連載第9回／分量：全6ページ
        </p>
        <div class="summary">
          <p>熊本県立美術館の現場監理実例として、「KUM現場監理ノート」（B6カード＋出来高曲線）を用いた手法を詳細解説。
          設計監理（スーパーバイズ）と現場監理（クラークスオブワークス）の役割分担、メモカード整理による「言った・言わない」解消、
          前川國男の「建築は出来上がるまで設計」思想と監理時間2倍重視を、埼玉県立博物館・国立国会図書館事例で示しています。
          </p>
        </div>
    </header>
