        <h2>10. KUM監理ノート 出来高曲線・打込みタイル工法・工事工程管理</h2>
        <p class="meta">
            掲載：全日本建築士会連合会機関誌『住と建築』2023年1月号　連載第10回／分量：全6ページ
        </p>
        <div class="summary">
          <p>熊本県立美術館「KUM現場監理ノート」の詳細実例。想定出来高曲線と実際の工事進捗比較、
          打込みタイル（先付けタイル）工法による躯体＋外装同時完成、土工事→杭工事→防水3段階→内装下地の工程管理をグラフ化。
          監理ポイント（製作図6ヶ月前、出来高月次報告、施工図承認ルール）を具体的な月次スケジュールで示しています。
          </p>
