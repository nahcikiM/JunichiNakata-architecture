        <h2>04. 敷地の調査と模型スタディによる熊本県立美術館の企画プロセス</h2>
        <p class="meta">
            掲載：全日本建築士会連合会機関誌『住と建築』2022年4月号　連載第4回／分量：全6ページ
        </p>
        <div class="summary">
            <p>熊本県立美術館の計画を通して、「樹木を一本も切らない」というテーマ設定から、
                敷地調査・模型づくり・ピーススタディを重ねてコンセプトを建築化していくプロセスを追った章です。
                敷地模型と断面スケッチによるボリューム検討、バッファーな空間の形成、コストや仕上げを含めた企画案のまとめ方まで、
                前川國男事務所の具体的な手法が段階的に示されています。
            </p>
        </div>
    </header>
