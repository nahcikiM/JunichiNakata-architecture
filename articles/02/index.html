        <h2>02. 手を通して考える</h2>
        <p class="meta">
            掲載：全日本建築士会連合会機関誌『住と建築』2022年1月号　連載第2回／分量：全6ページ
        </p>
        <div class="summary">
            <p>「敷地に立ってイメージが浮かばなければ建築家として向かない」前川國男の教え。敷地模型を作り手を動かすことで敷地の「力」をつかみ、人の動きを観察して空間を理解する設計初期の手法を解説。国立国会図書館新館の調査事例を通し、メモ整理・視覚化・体系図作成による問題発見のプロセスを紹介。</p>
        </div>
