        <p class="meta">
            掲載：全日本建築士会連合会機関誌『住と建築』2023年5月号　連載第14回／分量：全6ページ
        </p>
        <div class="summary">
          <p>コンクリート打設前後のチェック項目（かぶり厚さ・配筋・型枠・清掃・散水）、打込みタイル壁での打設方法、
          打設時間管理と連続打設の重要性、ジャンカ補修や養生方法を整理した章です。
