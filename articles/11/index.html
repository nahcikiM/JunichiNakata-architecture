        <h2>11. 現場体制・施工図・マスター工程・支払いと監理実務</h2>
        <p class="meta">
            掲載：全日本建築士会連合会機関誌『住と建築』2022年12月号　連載第9回／分量：全6ページ
        </p>
        <div class="summary">
          <p>熊本県立美術館を事例に、現場体制づくり（作業所所長選定・組織表・連絡網）、マスター工程と出来高報告、
          駆体図・天井伏図・施工図作成の優先順位、中間払いと内訳明細書によるコスト管理を具体的に解説。
          サブコン選定、式典段取り、文化庁との協議、スーパーバイザーとクラーク・オブ・ワークスの役割分担など、
          実務の現場監理ノウハウが整理されています。
          </p>
        </div>
    </header>
