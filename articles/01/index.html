        <h2>01. 「建築の生涯」をはじめるにあたって</h2>
        <p class="meta">
            掲載：全日本建築士会連合会機関誌『住と建築』2021年11月号　連載第1回／分量：全6ページ
        </p>
        <div class="summary">
            <p>「建築の生涯」連載第1回。前川國男のもとで21年間建築を学んだ著者が、近代建築の設計・監理・保全の全過程を俯瞰。前川事務所の組織変遷を通し、建築家が社会の信頼に応え、安全で健全な建物を作り上げる責任を論じる。戦後からデジタル時代へ続く建築の本質に迫る。</p>
        </div>

    </header>
