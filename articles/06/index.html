        <h2>06. 構造計画 柱梁配置・地質調査・バッファー空間架構・設備性能</h2>
        <p class="meta">
            掲載：全日本建築士会連合会機関誌『住と建築』2022年9月号　連載第6回／分量：全6ページ
        </p>
        <div class="summary">
            <p>基本設計段階での構造計画（柱梁配置・地質ボーリング調査）、パブリックスペースの格子梁天井やダブルコラム、
            設備系統・環境条件の決定プロセスを、熊本県立美術館・国立国会図書館の事例で解説。
            バッファー空間架構、コスト概算±10%管理、基本設計図書（配置図・平面図1/200）の構成方法も詳細に示しています。
            </p>
