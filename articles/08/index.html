        <p class="meta">
            掲載：全日本建築士会連合会機関誌『住と建築』2022年11月号　連載第8回／分量：全6ページ
        </p>
        <div class="summary">
          <p>実施設計の最終段階で、サッシュ割（H-1200×100鋼材）、コアー廻りのEV・シャフト・天井裏納まり、
